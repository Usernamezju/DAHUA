schema_version: auto_evolution_ntu120.v1

enabled: true
scan_interval_seconds: 30

pseudo_label:
  accept_score: 0.78
  review_score: 0.50
  minimum_teacher_confidence: 0.60
  minimum_pose_quality: 0.70
  review_priority: 750000

hard_mining:
  enabled: true
  config: hard_mining.yaml

training:
  enabled: true
  minimum_accepted_pseudo_labels: 20
  minimum_new_pseudo_labels: 10
  cooldown_hours: 12
  epochs: 10
  learning_rate: 0.0005
  gpus: 1
  max_replay_samples: 4000
  max_pseudo_samples: 2000
  maximum_checkpoint_bytes: 52428800
  minimum_mean_class_accuracy_improvement: 0.001
  maximum_top1_accuracy_drop: 0.002
  base_annotation_candidates:
    - "{data_root}/datasets/NTU/ProtoGCN/ntu120_3danno.pkl"
    - "{data_root}/datasets/ntu120_3d/ntu120_3danno.pkl"
    - "{data_root}/NTU/ProtoGCN/ntu120_3danno.pkl"
  python_candidates:
    - "/root/miniconda3/envs/skel_gcn38/bin/python"
    - "{python}"
